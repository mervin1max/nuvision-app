{% extends "base.html" %}
{% block title %}Live Results{% endblock %}
{% block content %}
<h1>Live Results <span class="live-dot" title="Updating automatically"></span></h1>
<p class="muted">Read-only view granted to you by the Discipline Master.</p>
<div id="results-root">Loading results&hellip;</div>

<script>
async function refreshResults() {
  try {
    const res = await fetch("{{ url_for('api_results') }}");
    if (!res.ok) throw new Error("Request failed");
    const data = await res.json();
    const root = document.getElementById("results-root");
    root.innerHTML = "";
    data.positions.forEach(pos => {
      const section = document.createElement("div");
      section.className = "panel results-position";
      const heading = document.createElement("h2");
      heading.textContent = pos.position_name + " — " + pos.total_votes + " vote(s)";
      section.appendChild(heading);
      if (pos.candidates.length === 0) {
        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = "No confirmed candidates yet.";
        section.appendChild(p);
      }
      pos.candidates.forEach(c => {
        const row = document.createElement("div");
        row.className = "bar-row";
        const label = document.createElement("div");
        label.className = "bar-label";
        label.textContent = c.name + ' ("' + c.nickname + '") — ' + c.votes + " vote(s), " + c.pct + "%";
        const track = document.createElement("div");
        track.className = "bar-track";
        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = c.pct + "%";
        if (pos.winner_application_id === c.application_id) fill.classList.add("bar-winner");
        track.appendChild(fill);
        row.appendChild(label);
        row.appendChild(track);
        section.appendChild(row);
      });
      root.appendChild(section);
    });
  } catch (e) {
    console.error("Could not refresh results", e);
  }
}
refreshResults();
setInterval(refreshResults, 4000);
</script>
{% endblock %}
